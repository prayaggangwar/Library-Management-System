<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="./librarian/librarian-style.css">
  <style>
    button {
      transition: transform 0.1s ease-in-out !important;
    }
    button:active {
      transform: scale(0.92) !important;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: inherit;
    }

    /* Responsive Design / Mobile Adaptability */
    @media (max-width: 768px) {
      body {
        flex-direction: column !important;
        display: flex;
      }
      .sidebar {
        display: none !important;
        width: 100% !important;
        height: auto !important;
        position: static !important;
        padding: 15px !important;
      }
      .sidebar.active {
        display: block !important;
      }
      .sidebar ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .sidebar li {
        flex: 1 1 calc(50% - 10px);
        margin: 0 !important;
        text-align: center;
        padding: 10px !important;
      }
      .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        padding: 15px !important;
      }
      .cards {
        display: flex !important;
        flex-direction: column !important;
      }
      .card {
        margin: 5px 0 !important;
      }
      .topbar {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .topbar h1 { font-size: 22px; text-align: center; }
      .hamburger {
        display: block;
      }
      .topbar-right {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
      }
      #add-librarian-controls {
        flex-direction: column;
      }
      #add-librarian-controls input, #add-librarian-controls button {
        width: 100% !important;
      }
      .section {
        overflow-x: auto;
      }
      table {
        min-width: 600px;
      }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <div id="adminEmailDisplay" style="text-align: center; margin-top: -20px; margin-bottom: 20px; color: #90caf9; font-size: 14px; word-wrap: break-word;"></div>

  <ul>
    <li class="active-item">Manage Librarians</li>
    <li class="logout-item" onclick="logout()">Logout</li>
  </ul>
</div>

<div class="main-content">
  <div class="topbar">
    <div style="display: flex; align-items: center; gap: 15px;">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <h1>Admin Dashboard</h1>
    </div>
    <div class="topbar-right">
      <button id="darkModeBtn" onclick="toggleDarkMode()">🌙</button>
    </div>
  </div>

  <div class="cards" style="margin-bottom: 25px;">
    <div class="card">
      <h3>Total Fine Collected</h3>
      <p>₹<span id="adminTotalCollected">0</span></p>
    </div>
    <div class="card">
      <h3>Authorized Librarians</h3>
      <p id="adminTotalLibrarians">0</p>
    </div>
  </div>

  <div id="manage-librarians" class="content-section active-section">
    <div class="section">
      <h2>Authorized Librarians</h2>

      <div id="add-librarian-controls" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="email" id="newLibrarianEmail" placeholder="Enter new librarian email" style="width: auto; flex: 1; margin-bottom: 0;">
        <button onclick="addLibrarian()">Add Librarian</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Email Address</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="librarianList"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="admin-script.js"></script>
<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('active');
  }
  document.querySelectorAll('.sidebar li').forEach(li => {
    li.addEventListener('click', () => {
      if (window.innerWidth <= 768) {
        document.querySelector('.sidebar').classList.remove('active');
      }
    });
  });
</script>
</body>
</html>
